<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" role="img" aria-label="PG Circuit blocking a high-risk UPDATE">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1419"/>
      <stop offset="100%" stop-color="#1a2332"/>
    </linearGradient>
  </defs>
  <rect width="920" height="440" rx="12" fill="url(#bg)"/>
  <rect x="0" y="0" width="920" height="40" fill="#121820"/>
  <circle cx="22" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="20" r="6" fill="#27c93f"/>
  <text x="24" y="25" fill="#8b9bb4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">psql — production</text>
  <text x="880" y="25" text-anchor="end" fill="#60a5fa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">pg_circuit</text>
  <text x="24" y="78" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">postgres=#</text>
  <text x="130" y="78" fill="#e8eef7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">UPDATE events SET archived = true</text>
  <text x="130" y="100" fill="#e8eef7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">WHERE created_at &lt; now() - interval '1 year';</text>
  <text x="24" y="140" fill="#fb7185" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">ERROR:</text>
  <text x="90" y="140" fill="#e8eef7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">PG Circuit [PGC001] blocked high-risk operation</text>
  <text x="24" y="172" fill="#8b9bb4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">DETAIL:  Risk: 89/100</text>
  <text x="24" y="196" fill="#8b9bb4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">        Estimated rows: 48,192,211</text>
  <text x="24" y="220" fill="#8b9bb4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">        Relation: public.events</text>
  <text x="24" y="244" fill="#8b9bb4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">        Runtime mode: PROTECT</text>
  <text x="24" y="268" fill="#8b9bb4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">        Replication lag: 18.2s</text>
  <text x="24" y="292" fill="#8b9bb4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">        Long transactions: 2</text>
  <text x="24" y="316" fill="#8b9bb4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">        Decision: BLOCK</text>
  <text x="24" y="356" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">HINT:</text>
  <text x="74" y="356" fill="#e8eef7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">retry in smaller batches, adjust thresholds, or wait until pressure drops</text>
  <text x="24" y="400" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">Same query. Different database state. Different decision.</text>
</svg>
