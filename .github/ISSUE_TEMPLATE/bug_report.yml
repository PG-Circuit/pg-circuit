name: Bug report
description: Something is broken in the extension or CLI
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve PG Circuit. Please search existing issues first.
        Security issues → security@pgcircuit.com or a private advisory — not here.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Clear description of the bug
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal SQL / steps
      render: sql
    validations:
      required: true
  - type: input
    id: pg
    attributes:
      label: PostgreSQL version
      placeholder: "17.11"
    validations:
      required: true
  - type: input
    id: ext
    attributes:
      label: pg_circuit version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / DETAIL / HINT
      render: text
