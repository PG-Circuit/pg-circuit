name: Feature request
description: Suggest an improvement for the open-source Runtime or CLI
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature ideas for the **open-source** Runtime/CLI. Commercial Cloud/Enterprise
        requests → sales@pgcircuit.com.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
